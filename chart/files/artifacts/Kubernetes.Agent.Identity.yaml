name: Kubernetes.Agent.Identity
author: Maxime Wewer
description: |
  Reports the Kubernetes identity of a velociraptor-agent (DaemonSet or ephemeral
  container): mode, node, cluster, and for ephemeral agents the target pod. Emitted at start
  then every `Period` seconds.

  Server.Kubernetes.AutoLabel turns these rows into client labels. Add this artifact to the
  client monitoring artifacts (GUI: Client Events, or the server config
  `Frontend.default_client_monitoring_artifacts`).

  Reads the VELOCIRAPTOR_K8S_* environment variables set by the chart / the kubectl plugin;
  emits nothing on other clients.

type: CLIENT_EVENT

parameters:
  - name: Period
    type: int
    default: 86400

sources:
  - query: |
      LET Identity = SELECT environ(var='VELOCIRAPTOR_K8S_MODE') AS Mode,
             environ(var='VELOCIRAPTOR_K8S_CLUSTER') AS Cluster,
             environ(var='VELOCIRAPTOR_K8S_NODE') AS Node,
             environ(var='VELOCIRAPTOR_K8S_NAMESPACE') AS Namespace,
             environ(var='VELOCIRAPTOR_K8S_POD') AS Pod,
             environ(var='VELOCIRAPTOR_K8S_TARGET_NAMESPACE') AS TargetNamespace,
             environ(var='VELOCIRAPTOR_K8S_TARGET_POD') AS TargetPod,
             environ(var='VELOCIRAPTOR_K8S_TARGET_CONTAINER') AS TargetContainer,
             environ(var='VELOCIRAPTOR_K8S_LABELS') AS ExtraLabels
        FROM scope()
        WHERE Mode

      SELECT * FROM foreach(row={ SELECT * FROM clock(start=0, period=Period) },
                            query=Identity)
