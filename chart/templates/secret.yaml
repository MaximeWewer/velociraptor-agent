{{- if and .Values.clientConfig.inline (not .Values.clientConfig.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velociraptor-agent.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "velociraptor-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.clientConfig.secretKey }}: |
    {{- .Values.clientConfig.inline | nindent 4 }}
{{- end }}
