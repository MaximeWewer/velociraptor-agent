{{- if .Values.serverArtifacts.enabled }}
# Kubernetes artifact pack, for the Velociraptor SERVER (client artifacts are sent by the
# server at collection time). Load it in the velociraptor chart with:
#   customArtifacts.enabled=true
#   customArtifacts.existingConfigMaps[0]={{ include "velociraptor-agent.artifactsConfigMapName" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "velociraptor-agent.artifactsConfigMapName" . }}
  namespace: {{ .Values.serverArtifacts.namespace | default .Release.Namespace }}
  labels:
    {{- include "velociraptor-agent.labels" . | replace "app.kubernetes.io/component: agent" "app.kubernetes.io/component: artifacts" | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/artifacts/*.yaml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
