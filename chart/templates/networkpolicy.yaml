{{- if and .Values.networkPolicy.enabled (not .Values.hostNetwork) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "velociraptor-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "velociraptor-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "velociraptor-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress: the agent only dials out to the frontend.
  ingress: []
  egress:
    - ports:
        - port: {{ .Values.networkPolicy.serverPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.serverPeers }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
