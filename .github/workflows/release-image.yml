name: Release Image

# Builds the multi-arch (amd64 + arm64) agent image and pushes it to GHCR.
# Version is the single source of truth: `ARG VELO_VERSION` in the Dockerfile.
# Tags: <version>, <version>-debug (busybox shell), latest.
# The fetch stage runs on the build platform (no emulation): it only downloads and verifies
# the per-arch binary. Each arch is then smoke-tested on a native runner.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          VELO_VERSION=$(grep -oP '^ARG VELO_VERSION=\K\S+' Dockerfile)
          [ -n "$VELO_VERSION" ] || { echo "ERROR: no ARG VELO_VERSION in Dockerfile" >&2; exit 1; }
          echo "version=${VELO_VERSION#v}" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/velociraptor-agent" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: debug
            suffix: "-debug"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}${{ matrix.suffix }}
            type=raw,value=latest,enable=${{ matrix.target == 'runtime' }}
          labels: |
            org.opencontainers.image.title=velociraptor-agent
            org.opencontainers.image.description=Velociraptor DFIR agent - multi-arch distroless image
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.vendor=Maxime Wewer
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,oci-mediatypes=true

  smoke:
    name: Smoke test (${{ matrix.runner }})
    needs: [prepare, build]
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Binary runs on this arch (glibc, distroless)
        run: |
          set -eux
          IMG='${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}'
          docker run --rm "$IMG" --nobanner version | grep -q 'version: ${{ needs.prepare.outputs.version }}'
          docker run --rm "$IMG-debug" --nobanner query "SELECT OS, Architecture FROM info()"
          docker run --rm --entrypoint /busybox/sh "$IMG-debug" -c 'test -d /var/tmp'

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [prepare, smoke]
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, sbom]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ needs.prepare.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: sbom/sbom.spdx.json
          body: |
            ## Velociraptor agent image v${{ needs.prepare.outputs.version }}

            Multi-arch (amd64, arm64), distroless/base-debian13.

            ```bash
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-debug
            ```
