# velociraptor --remap: the host root (mounted at /host) is "/" for the file/auto accessors.
# Generated from the Helm chart (helm template ... --show-only templates/configmap.yaml).
remappings:
- permissions:
  - COLLECT_CLIENT
  - FILESYSTEM_READ
  - FILESYSTEM_WRITE
  - READ_RESULTS
  - MACHINE_STATE
  - EXECVE
  - NETWORK
  type: permissions
- from:
    accessor: file
    prefix: /host
  "on":
    accessor: file
    path_type: linux
    prefix: /
  type: mount
- from:
    accessor: file
    prefix: /host
  "on":
    accessor: auto
    path_type: linux
    prefix: /
  type: mount
- from:
    accessor: file
    prefix: /proc
  "on":
    accessor: file
    path_type: linux
    prefix: /proc
  type: mount
- from:
    accessor: file
    prefix: /proc
  "on":
    accessor: auto
    path_type: linux
    prefix: /proc
  type: mount
- from:
    accessor: data
  "on":
    accessor: data
  type: shadow
